name: Bootstrap

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  help:
    name: :help (sanity)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run :help
        run: ./gradlew :help --no-daemon --stacktrace

  build-dist:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: help
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build bin zip
        run: ./gradlew :distributions-full:binZip --no-daemon --stacktrace

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: gradium-dist
          path: packaging/distributions-full/build/distributions/*.zip
          retention-days: 30
